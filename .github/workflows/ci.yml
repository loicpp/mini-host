name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  player-app-ci:
    name: Player App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: player-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-Check
        run: npm run type-check
      - name: Run Tests & Coverage
        run: |
          set -o pipefail
          NO_COLOR=1 npx vitest run --coverage | tee coverage-output.txt
          echo "### 📱 Player App Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always() # Upload même si les tests échouent
        with:
          name: coverage-player-app
          path: player-app/coverage/

  animator-ui-ci:
    name: Animator UI CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animator-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: animator-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-Check
        run: npm run type-check
      - name: Run Tests & Coverage
        run: |
          set -o pipefail
          NO_COLOR=1 npx vitest run --coverage | tee coverage-output.txt
          echo "### 🎛️ Animator UI Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-animator-ui
          path: animator-ui/coverage/

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov pytest-mock
      - name: Lint with flake8
        # Arrête le build uniquement s'il y a des erreurs critiques (erreurs de syntaxe Python, indéfinis)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Tests with Coverage
        run: |
          set -o pipefail
          export PYTHONPATH=.
          pytest --cov=core --cov-report=html --cov-report=term tests/ | tee coverage.txt
          echo "### 🐍 Backend Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/htmlcov/

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [player-app-ci, animator-ui-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows Executable
        run: build.bat
        shell: cmd
      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: minihost-windows
          path: backend\dist\MiniHost\MiniHost.exe

  build-linux-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    needs: [player-app-ci, animator-ui-ci, backend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Flatpak
        run: |
          chmod +x ./flatpak.sh
          ./flatpak.sh
      - name: Upload Flatpak Asset
        uses: actions/upload-artifact@v4
        with:
          name: minihost-linux-flatpak
          path: MiniHost-linux.flatpak
