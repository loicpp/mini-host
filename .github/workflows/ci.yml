name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  player-app-ci:
    name: Player App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: player-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-Check
        run: npm run type-check
      - name: Run Tests & Coverage
        run: npx vitest run --coverage

  animator-ui-ci:
    name: Animator UI CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animator-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: animator-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-Check
        run: npm run type-check
      - name: Run Tests & Coverage
        run: npx vitest run --coverage

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov pytest-mock
      - name: Lint with flake8
        # Arrête le build uniquement s'il y a des erreurs critiques (erreurs de syntaxe Python, indéfinis)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH=.
          pytest --cov=core tests/
