name: Release Pipeline

on:
  push:
    tags:
      - 'v*' # Se lance lors de la création d'un tag version, ex: v1.0.0

permissions:
  contents: write

jobs:
  deploy-player:
    name: Deploy Player App to Firebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inject Environment Variables
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat <<EOF > .env.production
          VITE_APP_VERSION=$VERSION
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF
        shell: bash
      - name: Deploy Player App
        run: bash deploy.sh
        working-directory: player-app
        env:
          # Assurez-vous d'ajouter ce secret dans les Settings > Secrets de votre dépôt GitHub
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - name: Deploy Firebase Rules
        run: bash deploy.sh
        working-directory: firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js (for animator-ui compilation)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Inject Environment Variables
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat <<EOF > animator-ui/.env.production
          VITE_APP_VERSION=$VERSION
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF
          cat <<EOF > backend/.env
          LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}
          EOF
        shell: bash
      - name: Build Linux Flatpak
        run: |
          chmod +x ./flatpak.sh
          ./flatpak.sh
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniHost-Linux
          path: MiniHost-linux.flatpak

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js (for animator-ui compilation)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject Environment Variables
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cat <<EOF > animator-ui/.env.production
          VITE_APP_VERSION=$VERSION
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF
          cat <<EOF > backend/.env
          LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}
          EOF
        shell: bash
      - name: Build Windows Executable
        run: build.bat
        shell: cmd
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: MiniHost-Windows-Portable
          path: backend/dist/MiniHost.exe
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MiniHost-Windows-Installer
          path: installer/MiniHostSetup.exe

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: MiniHost-Linux
          path: MiniHost-Linux
          
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: MiniHost-Windows-Installer
          path: MiniHost-Windows-Installer
          
      - name: Prepare Artifacts for Release
        run: |
          mv MiniHost-Windows-Installer/MiniHostSetup.exe MiniHost-windows.exe
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MiniHost-Linux/MiniHost-linux.flatpak
            MiniHost-windows.exe
          generate_release_notes: true
